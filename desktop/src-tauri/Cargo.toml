[package]
name = "jeanpaul-agent"
version = "1.0.7"
description = "JEAN PAUL desktop auto-apply agent"
authors = ["JEAN PAUL"]
edition = "2021"

[lib]
name = "jeanpaul_agent_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# brotli 8.0.3 from crates.io ne compile pas sur rustc 1.96+
[patch.crates-io]
brotli = { git = "https://github.com/dropbox/rust-brotli", branch = "master" }
