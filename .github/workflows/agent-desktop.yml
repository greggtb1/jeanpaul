name: Build BLOW MY JOB Agent

on:
  push:
    tags:
      - "agent-v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: BLOW-MY-JOB-Agent_aarch64.dmg
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: BLOW-MY-JOB-Agent_x64.dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: BLOW-MY-JOB-Agent_x64-setup.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install desktop deps
        working-directory: desktop
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build Python sidecar
        shell: bash
        run: bash desktop/scripts/build-sidecar.sh

      - name: Build Tauri app
        working-directory: desktop
        env:
          VITE_API_ORIGIN: https://blowmyjob.fr
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Normalize installer filename
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/downloads/agent
          if [[ "${{ matrix.target }}" == "x86_64-pc-windows-msvc" ]]; then
            files=(desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe)
            cp "${files[0]}" public/downloads/agent/BLOW-MY-JOB-Agent_x64-setup.exe
          elif [[ "${{ matrix.target }}" == "aarch64-apple-darwin" ]]; then
            files=(desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
            cp "${files[0]}" public/downloads/agent/BLOW-MY-JOB-Agent_aarch64.dmg
          else
            files=(desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
            cp "${files[0]}" public/downloads/agent/BLOW-MY-JOB-Agent_x64.dmg
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            public/downloads/agent/${{ matrix.artifact }}
          if-no-files-found: error
